<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Stribble</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <main class="section container">
    <div style="max-width: 800px; margin: 0 auto;">
      <h1 class="section__title">Contact Us</h1>
      <p style="color: #666; margin-bottom: 2rem;">Have questions about our YouTube courses? We're here to help.</p>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem;">
        
        <div>
          <h3 style="margin-bottom: 1rem;">Support Details</h3>
          <p style="line-height: 1.8; color: #444;">
            <strong>Email:</strong><br>
            [Your Email Here]
          </p>
          <p style="line-height: 1.8; color: #444; margin-top: 1.5rem;">
            <strong>Operational Address:</strong><br>
            [Your Full Address Here]
          </p>
          <p style="line-height: 1.8; color: #444; margin-top: 1.5rem;">
            <strong>Business Hours:</strong><br>
            Monday to Friday: 10:00 AM – 6:00 PM
          </p>
        </div>

        <div style="background: #f9f9f9; padding: 2rem; border-radius: 12px;">
          <form action="#" method="post" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Name</label>
              <input type="text" style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px;" placeholder="Your Name">
            </div>
            <div>
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email</label>
              <input type="email" style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px;" placeholder="email@example.com">
            </div>
            <div>
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Message</label>
              <textarea style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; height: 100px;" placeholder="How can we help?"></textarea>
            </div>
            <button type="button" class="btn btn--primary" style="width: 100%;">Send Message</button>
          </form>
        </div>

      </div>
    </div>
  </main>

  </body>
</html>
