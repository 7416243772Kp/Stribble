<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Stribble</title>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <div class="container legal-page">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you! Reach out to us at <a href="mailto:contact@stribble.site">contact@stribble.site</a> or use the form below.</p>
        <p>Have a question or need help? Send us a message below.</p>

        <form id="contactForm" class="admin-form">
            <div class="form-group">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="btn-primary">Send Message</button>
        </form>
        <div id="responseMsg" style="margin-top: 20px; display: none;"></div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const responseMsg = document.getElementById('responseMsg');
            const data = {
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                responseMsg.style.display = 'block';
                responseMsg.innerText = result.message;
                responseMsg.style.color = response.ok ? 'green' : 'red';
                
                if(response.ok) document.getElementById('contactForm').reset();
            } catch (error) {
                responseMsg.style.display = 'block';
                responseMsg.innerText = 'Something went wrong. Please try again.';
                responseMsg.style.color = 'red';
            }
        });
    </script>
</body>
</html>
