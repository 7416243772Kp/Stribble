<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details | Stribble</title>
  <script src="js/settings.js" defer></script>
  <link rel="stylesheet" href="css/course.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" style="position:sticky;top:0;z-index:90;background:transparent">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;padding:12px 0">
      <div class="logo"><a href="index.html" class="brand"><span class="brand__dot"></span> Stribble</a></div>
      <div style="display:flex;gap:10px;align-items:center">
        <button id="themeToggle" class="btn" title="Toggle dark mode">🌙</button>
        <button class="nav-toggle" id="navToggle" aria-label="Open menu">☰</button>
      </div>
    </div>
  </nav>

  <!-- Course Section -->
  <main class="container">
    <h2 class="section-title">Course Details</h2>
    <div id="course-details" class="course-grid">
      <!-- Course details will load dynamically -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Stribble. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/ui-helpers.js" defer></script>

  <script>
    async function loadCourseDetails() {
      const params = new URLSearchParams(window.location.search);
      const courseId = params.get("id");

      const courseDetailsContainer = document.getElementById("course-details");

      if (!courseId) {
        courseDetailsContainer.innerHTML = "<p style='text-align:center; color:#666;'>No course selected.</p>";
        return;
      }

      try {
        const res = await fetch(`${window.API_BASE}/api/courses/${courseId}`);
        if (!res.ok) {
          const text = await res.text();
          console.error('Course fetch failed', res.status, text);
          throw new Error(`Course fetch failed: ${res.status}`);
        }
        const data = await res.json();

        const course = data.course || data;

        // Use data-src on thumbnail for lazy loading and skeleton class
        courseDetailsContainer.innerHTML = `
          <div class="course-card" style="cursor:default;">
            <div style="flex:0 0 360px;max-width:360px">
              <div class="skeleton" style="border-radius:12px;overflow:hidden">
                <img data-src="${course.thumbnail || '/images/placeholder-course.png'}" alt="${(course.title||'').replace(/\"/g,'')}" loading="lazy" class="skeleton" style="width:100%;height:220px;object-fit:cover;border-radius:12px"/>
              </div>
            </div>
            <div class="course-info" style="flex:1">
              <h3 style="margin-top:0">${course.title}</h3>
              <p style="color:var(--muted)">${course.description}</p>
              <div style="margin-top:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                <span class="price" style="font-weight:800">₹${course.price}</span>
                <button id="enrollBtn" class="enroll-btn">Buy Now</button>
              </div>
            </div>
          </div>
        `;

        // run lazy loader for the injected image
        if (window.UI && typeof window.UI.lazyLoadImages === 'function') {
          window.UI.lazyLoadImages(document.getElementById('course-details'));
        }

        // Add click listener for Buy Now
        document.getElementById("enrollBtn").addEventListener("click", () => {
          // Save selected course in localStorage for checkout
          localStorage.setItem("selectedCourse", JSON.stringify({
            _id: course._id,
            title: course.title,
            price: course.price,
            thumbnail: course.thumbnail // include thumbnail
          }));
          // Redirect to checkout page
          window.location.href = `checkout.html?courseId=${course._id}`;
        });

      } catch (err) {
        console.error("Error loading course:", err);
        courseDetailsContainer.innerHTML = "<p style='text-align:center; color:red;'>Failed to load course details.</p>";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('year').textContent = new Date().getFullYear();
      loadCourseDetails();

      // mobile nav toggle (simple)
      const navToggle = document.getElementById('navToggle');
      navToggle?.addEventListener('click', () => {
        // nothing complex: could open a small menu if needed
        alert('Open menu (mobile)'); // replace with your mobile nav if needed
      });
    });
  </script>
</body>
</html>
