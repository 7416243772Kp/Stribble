<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details | Stribble</title>
  <script src="js/settings.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Stribble</div>
  </nav>

  <!-- Course Section -->
  <main class="container">
    <h2 class="section-title">Course Details</h2>
    <div id="course-details" class="course-grid">
      <!-- Course details will load dynamically -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 Stribble. All rights reserved.</p>
  </footer>

  <script>
    async function loadCourseDetails() {
      const params = new URLSearchParams(window.location.search);
      const courseId = params.get("id");

      const courseDetailsContainer = document.getElementById("course-details");

      if (!courseId) {
        courseDetailsContainer.innerHTML = "<p style='text-align:center; color:#666;'>No course selected.</p>";
        return;
      }

      try {
        const res = await fetch(`${window.API_BASE}/api/courses/${courseId}`);
        if (!res.ok) {
          const text = await res.text(); // helps debugging: HTML error body
          console.error('Course fetch failed', res.status, text);
          throw new Error(`Course fetch failed: ${res.status}`);
        }
        const data = await res.json();

        const course = data.course || data;

        courseDetailsContainer.innerHTML = `
          <div class="course-card" style="cursor:default;">
            <img src="${course.thumbnail}" alt="${course.title}">
            <div class="course-info">
              <h3>${course.title}</h3>
              <p>${course.description}</p>
              <span class="price">₹${course.price}</span>
              <button id="enrollBtn" class="enroll-btn">Buy Now</button>
            </div>
          </div>
        `;

        // Add click listener for Buy Now
        document.getElementById("enrollBtn").addEventListener("click", () => {
          // Save selected course in localStorage for checkout
          localStorage.setItem("selectedCourse", JSON.stringify({
            id: course._id,
            title: course.title,
            price: course.price
          }));

          // Redirect to checkout page
          window.location.href = `checkout.html?courseId=${course._id}`;
        });

      } catch (err) {
        console.error("Error loading course:", err);
        courseDetailsContainer.innerHTML = "<p style='text-align:center; color:red;'>Failed to load course details.</p>";
      }
    }

    document.addEventListener("DOMContentLoaded", loadCourseDetails);
  </script>
</body>
</html>
