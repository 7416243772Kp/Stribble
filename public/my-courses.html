<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Courses | Stribble</title>
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/settings.js" defer></script>
  <script src="/js/my-courses.js" defer></script>
  
  <style>
      /* ULTRA-MINIMAL LIST LAYOUT - No cards, no boxes, no forced dimensions */
      .my-courses-grid {
          display: flex;
          flex-direction: column;
          gap: 48px;
          margin-top: 30px;
      }

      /* COURSE ITEM - Pure horizontal layout, completely clean */
      .my-course-item {
          display: flex;
          flex-direction: row;
          align-items: flex-start;
          gap: 24px;
      }

      /* IMAGE - Natural dimensions, no constraints */
      .my-course-item img {
          display: block;
          max-width: 200px;
          width: auto;
          height: auto; /* TRUE natural aspect ratio */
          border-radius: 8px;
      }

      /* CONTENT - Right Side */
      .my-course-content {
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 12px;
      }

      .my-course-content h3 {
          font-size: 1.3rem;
          font-weight: 700;
          color: #0f172a;
          margin: 0;
          line-height: 1.4;
      }

      .my-course-content .actions {
          display: flex;
          gap: 12px;
          align-items: center;
          flex-wrap: wrap;
          margin-top: 8px;
      }

      /* BUTTONS */
      .btn-read {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          background-color: #0f172a;
          color: white;
          padding: 10px 20px;
          border-radius: 8px;
          font-weight: 600;
          font-size: 0.9rem;
          text-decoration: none;
          transition: background 0.2s;
      }
      .btn-read:hover {
          background-color: #334155;
      }

      .btn-write-review {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          background: white;
          color: #475569;
          padding: 10px 20px;
          border: 1px solid #cbd5e1;
          border-radius: 8px;
          font-weight: 600;
          font-size: 0.9rem;
          cursor: pointer;
          transition: all 0.2s;
      }
      .btn-write-review:hover {
          border-color: #94a3b8;
          background: #f8fafc;
      }

      .reviewed-badge {
          color: #10b981;
          font-size: 0.9rem;
          font-weight: 600;
          display: flex;
          align-items: center;
          gap: 4px;
      }

      .empty-state {
          text-align: center;
          padding: 60px 20px;
          color: #64748b;
      }

      /* Mobile responsive */
      @media (max-width: 600px) {
          .my-course-item {
              flex-direction: column;
              gap: 16px;
          }
          .my-course-item img {
              max-width: 100%;
          }
      }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="brand">
        <span class="brand__dot" aria-hidden="true"></span>
        <span class="brand__name">Stribble</span>
      </a>
      
      <div id="auth-ui">
          <!-- Will be filled by JS -->
          <a href="/" class="btn btn--outline">Home</a>
      </div>
    </div>
  </header>

  <main class="container" style="min-height: 60vh; padding-top: 40px; padding-bottom: 60px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1 class="section__title" style="margin:0;">My Courses</h1>
        <div id="user-welcome" style="color: #64748b;"></div>
    </div>

    <div id="loading" style="text-align: center; margin-top: 50px;">
        <div class="loader" style="margin: 0 auto;"></div>
        <p style="margin-top: 15px; color: #64748b;">Loading your library...</p>
    </div>

    <div id="courses-grid" class="my-courses-grid" style="display: none;">
        <!-- Courses will be injected here -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <h3>No courses found</h3>
        <p style="color: #64748b; margin-bottom: 20px;">You haven't purchased any courses yet.</p>
        <a href="index.html" class="btn btn--primary">Browse Courses</a>
    </div>



  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div>
        <div class="brand" style="margin-bottom: 0.75rem;">
          <span class="brand__dot"></span>
          <span class="brand__name">Stribble</span>
        </div>
        <p style="font-size: 0.95rem; line-height: 1.6;">
            Empowering learners worldwide with accessible, high-quality education.
        </p>
      </div>
      <div>
        <h4>Support</h4>
        <a href="contact">Contact Us</a>
        <a href="index.html">All Courses</a>
      </div>
    </div>
    <div class="copyright">
      &copy; <span id="year"></span> Stribble. All rights reserved.
    </div>
  </footer>

</body>
</html>
