<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Courses | Stribble</title>
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/settings.js" defer></script>
  <script src="/js/my-courses.js" defer></script>
  
  <style>
      /* GRID LAYOUT - Wider columns for horizontal cards */
      .my-courses-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
          gap: 24px;
          margin-top: 30px;
      }

      /* CARD STYLING - HORIZONTAL */
      .my-course-card {
          background: white;
          border: 1px solid #e2e8f0;
          border-radius: 16px;
          overflow: hidden;
          transition: transform 0.2s, box-shadow 0.2s;
          display: flex;
          flex-direction: row; /* Horizontal Layout */
          align-items: stretch;
      }
      .my-course-card:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.08);
      }

      /* MEDIA (Thumbnail) - Left Side, 1:1 Ratio */
      .my-course-media {
          width: 140px; /* Fixed width */
          flex-shrink: 0;
          aspect-ratio: 1/1; /* Square */
          background: #f1f5f9;
          border-right: 1px solid #f1f5f9;
          position: relative;
      }
      .my-course-media img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
      }

      /* BODY - Right Side */
      .my-course-body {
          padding: 16px 20px;
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
      }

      .my-course-title {
          font-size: 1.1rem;
          font-weight: 700;
          color: #0f172a;
          margin-bottom: 6px;
          line-height: 1.35;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
      }

      .my-course-desc {
          font-size: 0.85rem;
          color: #64748b;
          margin-bottom: 12px;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          line-height: 1.5;
      }

      .my-course-actions {
          margin-top: auto;
      }

      /* BUTTON */
      .btn-start-reading {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          background-color: #0f172a;
          color: white;
          padding: 8px 16px;
          border-radius: 8px;
          font-weight: 600;
          font-size: 0.9rem;
          text-decoration: none;
          transition: background 0.2s, transform 0.1s;
          width: auto; /* Allow natural width */
          align-self: flex-start;
      }
      .btn-start-reading:hover {
          background-color: #334155;
      }

      .empty-state {
          text-align: center;
          padding: 60px 20px;
          background: #f8fafc;
          border-radius: 12px;
          border: 1px dashed #cbd5e1;
      }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="brand">
        <span class="brand__dot" aria-hidden="true"></span>
        <span class="brand__name">Stribble</span>
      </a>
      
      <div id="auth-ui">
          <!-- Will be filled by JS -->
          <a href="/" class="btn btn--outline">Home</a>
      </div>
    </div>
  </header>

  <main class="container" style="min-height: 60vh; padding-top: 40px; padding-bottom: 60px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1 class="section__title" style="margin:0;">My Courses</h1>
        <div id="user-welcome" style="color: #64748b;"></div>
    </div>

    <div id="loading" style="text-align: center; margin-top: 50px;">
        <div class="loader" style="margin: 0 auto;"></div>
        <p style="margin-top: 15px; color: #64748b;">Loading your library...</p>
    </div>

    <div id="courses-grid" class="my-courses-grid" style="display: none;">
        <!-- Courses will be injected here -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <h3>No courses found</h3>
        <p style="color: #64748b; margin-bottom: 20px;">You haven't purchased any courses yet.</p>
        <a href="index.html" class="btn btn--primary">Browse Courses</a>
    </div>



  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div>
        <div class="brand" style="margin-bottom: 0.75rem;">
          <span class="brand__dot"></span>
          <span class="brand__name">Stribble</span>
        </div>
        <p style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.6;">
            Empowering learners worldwide with accessible, high-quality education.
        </p>
      </div>
      <div>
        <h4>Support</h4>
        <a href="contact">Contact Us</a>
        <a href="index.html">All Courses</a>
      </div>
    </div>
    <div class="copyright">
      &copy; <span id="year"></span> Stribble. All rights reserved.
    </div>
  </footer>

</body>
</html>
