<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Reader | Stribble</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- PDF.js v3 text & annotation layer CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <!-- PDF.js v3 library (classic script, not ESM) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: #f1f5f9;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            min-height: 100vh;
            /* Prevent selection everywhere EXCEPT the text layer */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            overflow: hidden;
            color: #1e293b;
        }

        /* ==================== PROGRESS BAR (Top) ==================== */
        #progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            z-index: 2000;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #6366f1, #8b5cf6);
            border-radius: 0 2px 2px 0;
            transition: width 0.4s ease;
        }

        /* ==================== TOP BAR ==================== */
        .top-bar {
            position: fixed;
            top: 4px;
            left: 0;
            right: 0;
            height: 48px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1500;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.15s ease;
            font-family: inherit;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
        }

        .top-bar-center {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        .top-bar-center span {
            color: #6366f1;
        }

        .menu-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: 1px solid #e2e8f0;
            color: #475569;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            transition: all 0.15s ease;
        }

        .menu-toggle:hover {
            background: #f1f5f9;
            color: #0f172a;
            transform: none;
        }

        /* ==================== MAIN LAYOUT ==================== */
        .reader-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            padding-top: 52px; /* top bar + progress bar */
        }

        /* ==================== VIEWER (Left / Main) ==================== */
        .viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            padding: 24px 20px 100px 20px;
            position: relative;
        }

        #viewer-container {
            position: relative;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            background: #fff;
            max-width: 95%;
            border-radius: 8px;
            overflow: visible;
            display: inline-block;
        }

        /* PDF page wrapper — positions canvas, text layer, and annotation layer */
        #pdf-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
            height: auto;
        }

        #pdf-wrapper canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }



        /* ==================== ANNOTATION LAYER (clickable links) ==================== */
        .annotationLayer a {
            cursor: pointer !important;
        }

        .annotationLayer a:hover {
            background: rgba(99, 102, 241, 0.08);
            border-radius: 2px;
        }

        /* Watermark Overlay — on top of everything but pointer-events: none */
        .watermark-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 50;
        }

        .watermark-text {
            position: absolute;
            color: rgba(128, 128, 128, 0.10);
            font-size: 18px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            transform: rotate(-45deg);
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
        }

        /* Loading Spinner */
        .page-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            color: #94a3b8;
            font-size: 1rem;
        }

        .page-loading .spinner {
            width: 28px; height: 28px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ==================== SIDEBAR (Right — White, inline) ==================== */
        .page-sidebar {
            width: 0;
            min-width: 0;
            overflow: hidden;
            background: #ffffff;
            border-left: 1px solid transparent;
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease;
            flex-shrink: 0;
        }

        .page-sidebar.open {
            width: 270px;
            min-width: 270px;
            border-left-color: #e2e8f0;
        }

        .sidebar-header {
            padding: 16px 18px 14px;
            border-bottom: 1px solid #f1f5f9;
            flex-shrink: 0;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-header .progress-summary {
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
        }

        .sidebar-header .progress-summary span {
            color: #6366f1;
            font-weight: 600;
        }

        /* Mini progress bar inside sidebar */
        .sidebar-progress-track {
            width: 100%;
            height: 4px;
            background: #f1f5f9;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .sidebar-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #6366f1);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        /* Page List */
        .page-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }

        .page-list::-webkit-scrollbar {
            width: 4px;
        }

        .page-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .page-list::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px;
        }

        .page-list::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        .page-item {
            display: flex;
            align-items: center;
            padding: 9px 18px;
            cursor: pointer;
            font-size: 13px;
            color: #94a3b8;
            transition: all 0.15s ease;
            gap: 12px;
            border-left: 3px solid transparent;
            position: relative;
        }

        .page-item:hover {
            background: #f8fafc;
            color: #475569;
        }

        .page-item.active {
            background: #eff6ff;
            color: #2563eb;
            border-left-color: #3b82f6;
            font-weight: 600;
        }

        .page-item.visited {
            color: #475569;
        }

        .page-item .page-number {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #f8fafc;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
            color: #94a3b8;
            transition: all 0.15s ease;
        }

        .page-item.active .page-number {
            background: #dbeafe;
            color: #2563eb;
        }

        .page-item.visited .page-number {
            background: #f0fdf4;
            color: #16a34a;
        }

        .page-item .page-label {
            flex: 1;
        }

        .page-item .check-icon {
            font-size: 12px;
            color: #22c55e;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .page-item.visited .check-icon {
            opacity: 1;
        }

        /* ==================== CONTROLS (Bottom) ==================== */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            gap: 16px;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            backdrop-filter: blur(12px);
        }

        .controls button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .controls button:hover { background: #2563eb; transform: translateY(-1px); }
        .controls button:active { transform: translateY(0); }
        .controls button:disabled { background: #cbd5e1; cursor: not-allowed; opacity: 0.6; transform: none; }

        #page-info {
            color: #475569;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-size: 13px;
        }

        /* ==================== SECURITY ==================== */
        .blurred {
            filter: blur(15px);
            pointer-events: none;
        }

        #security-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            color: white;
            z-index: 9999;
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }


        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .top-bar-center { display: none; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Progress Bar -->
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="/my-courses" class="back-btn" title="Back to My Courses">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            My Courses
        </a>
        <div class="top-bar-center">
            <span id="progress-label-inline">0%</span> complete
        </div>
        <button class="menu-toggle" id="sidebarToggle" title="Toggle page list">☰</button>
    </div>

    <!-- Security Warning -->
    <div id="security-warning">
        <h1 style="color: #ef4444; margin-bottom: 10px;">⚠️ Security Alert</h1>
        <p style="font-size: 1.2rem; color: #cbd5e1;">Content is hidden while the window is inactive.</p>
        <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 5px;">Please verify your identity if requested.</p>
    </div>



    <div class="reader-layout">
        <!-- Main Viewer -->
        <div class="viewer-area" id="viewerArea">
            <div id="viewer-container">
                <div id="page-loading" class="page-loading">
                    <div class="spinner"></div>
                    <span>Loading course...</span>
                </div>

                <!-- PDF page wrapper: canvas + annotation layer -->
                <div id="pdf-wrapper" style="display: none; position: relative;">
                    <canvas id="pdf-canvas"></canvas>
                    <div id="annotation-layer" class="annotationLayer" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0;"></div>
                </div>

                <div id="watermark-overlay" class="watermark-overlay"></div>
            </div>
        </div>

        <!-- Page Sidebar (White, starts closed) -->
        <aside class="page-sidebar" id="pageSidebar">
            <div class="sidebar-header">
                <h3>📄 Pages</h3>
                <div class="progress-summary">
                    <span id="sidebar-progress-pct">0%</span> completed · <span id="sidebar-visited-count">0</span>/<span id="sidebar-total-count">0</span> pages
                </div>
                <div class="sidebar-progress-track">
                    <div class="sidebar-progress-fill" id="sidebarProgressFill"></div>
                </div>
            </div>
            <div class="page-list" id="pageList">
                <!-- Page items injected dynamically -->
            </div>
        </aside>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
        <button id="prev">← Prev</button>
        <span id="page-info">Loading...</span>
        <button id="next">Next →</button>
    </div>

    <script>
        // ==================== PDF.js v3 Setup ====================
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        if (!courseId) {
            alert("No course specified!");
            window.location.href = "/";
        }

        // ==================== STATE ====================
        let pdfDoc = null;
        let pageNum = 1;
        let totalPages = 0;
        let watermarkText = "Loading...";
        let isLoadingPage = false;
        let visitedPages = new Set();
        let sidebarOpen = false;

        // DOM refs
        const pageLoading = document.getElementById('page-loading');
        const pdfWrapper = document.getElementById('pdf-wrapper');
        const watermarkOverlay = document.getElementById('watermark-overlay');
        const pageList = document.getElementById('pageList');
        const progressBar = document.getElementById('progress-bar');
        const progressLabelInline = document.getElementById('progress-label-inline');
        const sidebarProgressFill = document.getElementById('sidebarProgressFill');
        const sidebarProgressPct = document.getElementById('sidebar-progress-pct');
        const sidebarVisitedCount = document.getElementById('sidebar-visited-count');
        const sidebarTotalCount = document.getElementById('sidebar-total-count');


        // Block copy/cut — wipe clipboard data
        document.addEventListener('copy', function(e) {
            e.preventDefault();
            if (e.clipboardData) {
                e.clipboardData.setData('text/plain', '');
                e.clipboardData.setData('text/html', '');
            }

        });

        document.addEventListener('cut', function(e) {
            e.preventDefault();
            if (e.clipboardData) {
                e.clipboardData.setData('text/plain', '');
                e.clipboardData.setData('text/html', '');
            }

        });

        // Block keyboard shortcuts: Ctrl+C, Ctrl+A, Ctrl+S, Ctrl+P, Ctrl+U
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                const key = e.key.toLowerCase();
                if (key === 'c' || key === 'a' || key === 's' || key === 'p' || key === 'u') {
                    e.preventDefault();
                    if (key === 'c' || key === 'a') showCopyToast();
                }
            }
        });

        // Block drag (prevent drag-to-drop text extraction)
        document.addEventListener('dragstart', function(e) { e.preventDefault(); });

        // Override clipboard API
        if (navigator.clipboard) {
            try {
                navigator.clipboard.writeText = async function() { return; };
                if (navigator.clipboard.write) navigator.clipboard.write = async function() { return; };
            } catch(e) {}
        }

        // ==================== LOCAL STORAGE HELPERS ====================
        const STORAGE_KEY_PAGE = `stribble_last_page_${courseId}`;
        const STORAGE_KEY_VISITED = `stribble_visited_${courseId}`;

        function saveProgress() {
            try {
                localStorage.setItem(STORAGE_KEY_PAGE, pageNum.toString());
                localStorage.setItem(STORAGE_KEY_VISITED, JSON.stringify([...visitedPages]));
                localStorage.setItem(`stribble_total_pages_${courseId}`, totalPages.toString());
            } catch(e) {}
        }

        function loadSavedProgress() {
            try {
                const savedPage = localStorage.getItem(STORAGE_KEY_PAGE);
                const savedVisited = localStorage.getItem(STORAGE_KEY_VISITED);
                if (savedVisited) {
                    const arr = JSON.parse(savedVisited);
                    arr.forEach(p => visitedPages.add(p));
                }
                return savedPage ? parseInt(savedPage, 10) : 1;
            } catch(e) {
                return 1;
            }
        }

        // ==================== WATERMARK ====================
        function renderWatermark() {
            watermarkOverlay.innerHTML = '';
            const container = document.getElementById('viewer-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            const stepX = Math.max(width / 2, 250);
            const stepY = Math.max(height / 4, 200);
            for (let x = -100; x < width + 100; x += stepX) {
                for (let y = 0; y < height + 100; y += stepY) {
                    const span = document.createElement('span');
                    span.className = 'watermark-text';
                    span.textContent = watermarkText;
                    span.style.left = x + 'px';
                    span.style.top = y + 'px';
                    watermarkOverlay.appendChild(span);
                }
            }
        }

        // ==================== PROGRESS ====================
        function updateProgress() {
            const pct = totalPages > 0 ? Math.round((visitedPages.size / totalPages) * 100) : 0;
            progressBar.style.width = pct + '%';
            progressLabelInline.textContent = pct + '%';
            sidebarProgressFill.style.width = pct + '%';
            sidebarProgressPct.textContent = pct + '%';
            sidebarVisitedCount.textContent = visitedPages.size;
            sidebarTotalCount.textContent = totalPages;
        }

        // ==================== SIDEBAR ====================
        const sidebar = document.getElementById('pageSidebar');

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            sidebar.classList.toggle('open', sidebarOpen);
        }

        document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);

        function buildPageList() {
            pageList.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const item = document.createElement('div');
                item.className = 'page-item';
                item.dataset.page = i;
                item.innerHTML = `
                    <div class="page-number">${i}</div>
                    <div class="page-label">Page ${i}</div>
                    <span class="check-icon">✓</span>
                `;
                item.addEventListener('click', () => loadPage(i));
                pageList.appendChild(item);
            }
            updateSidebarHighlight();
        }

        function updateSidebarHighlight() {
            const items = pageList.querySelectorAll('.page-item');
            items.forEach(item => {
                const p = parseInt(item.dataset.page, 10);
                item.classList.toggle('active', p === pageNum);
                item.classList.toggle('visited', visitedPages.has(p) && p !== pageNum);
            });

            const activeItem = pageList.querySelector('.page-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        // ==================== PAGE LOADING (PDF.js v3 — High-DPI + renderTextLayer + AnnotationLayer) ====================
        async function loadPage(num) {
            if (isLoadingPage || num < 1 || num > totalPages || !pdfDoc) return;
            isLoadingPage = true;
            pdfWrapper.style.display = 'none';
            pageLoading.style.display = 'flex';

            try {
                const page = await pdfDoc.getPage(num);

                // --- 1. DYNAMIC RESPONSIVE SCALE ---
                const viewerArea = document.getElementById('viewerArea');
                // Calculate width accounting for padding (40px)
                const availableWidth = viewerArea.clientWidth > 0 ? (viewerArea.clientWidth - 40) : window.innerWidth;
                const unscaledViewport = page.getViewport({ scale: 1.0 });

                // Calculate scale to fit width. Capped at 2.5 to prevent massive sizing on ultra-wide screens.
                const scale = Math.min((availableWidth / unscaledViewport.width), 2.5);
                const viewport = page.getViewport({ scale: scale });

                // --- 2. HIGH-RESOLUTION CANVAS RENDER (Retina/High-DPI Fix) ---
                const outputScale = window.devicePixelRatio || 1;
                const canvas = document.getElementById('pdf-canvas');
                const context = canvas.getContext('2d');

                // Internal hardware resolution (actual pixels)
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);

                // Visual resolution (CSS pixels)
                canvas.style.width = Math.floor(viewport.width) + "px";
                canvas.style.height = "auto";
                canvas.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

                // Match wrapper size so absolute layers align perfectly
                pdfWrapper.style.width = Math.floor(viewport.width) + "px";
                pdfWrapper.style.height = "auto";
                pdfWrapper.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

                const renderContext = {
                    canvasContext: context,
                    transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
                    viewport: viewport
                };

                await page.render(renderContext).promise;


                // --- 4. Render Clickable Links Manually ---
                const annotationLayerDiv = document.getElementById('annotation-layer');
                annotationLayerDiv.innerHTML = '';
                annotationLayerDiv.style.height = '100%';
                annotationLayerDiv.style.width = '100%';

                // Force the link layer to the very front so it doesn't get blocked
                annotationLayerDiv.style.zIndex = '100';
                annotationLayerDiv.style.pointerEvents = 'auto';

                const annotationsData = await page.getAnnotations();

                annotationsData.forEach(anno => {
                    if (anno.subtype === 'Link') {
                        const url = anno.url || (anno.action && anno.action.url);

                        if (url) {
                            const link = document.createElement('a');
                            link.href = url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';

                            const [llx, lly, urx, ury] = anno.rect;
                            const pt1 = viewport.convertToViewportPoint(llx, lly);
                            const pt2 = viewport.convertToViewportPoint(urx, ury);

                            const minX = Math.min(pt1[0], pt2[0]);
                            const maxX = Math.max(pt1[0], pt2[0]);
                            const minY = Math.min(pt1[1], pt2[1]);
                            const maxY = Math.max(pt1[1], pt2[1]);

                            // Convert explicit pixels into percentages for perfect responsiveness
                            const pctLeft = (minX / viewport.width) * 100;
                            const pctTop = (minY / viewport.height) * 100;
                            const pctWidth = ((maxX - minX) / viewport.width) * 100;
                            const pctHeight = ((maxY - minY) / viewport.height) * 100;

                            link.style.position = 'absolute';
                            link.style.display = 'block';
                            link.style.left = pctLeft + '%';
                            link.style.top = pctTop + '%';
                            link.style.width = pctWidth + '%';
                            link.style.height = pctHeight + '%';
                            link.style.cursor = 'pointer';


                            annotationLayerDiv.appendChild(link);
                        }
                    }
                });

                // --- 5. Finish & Update UI ---
                pageNum = num;
                visitedPages.add(num);
                saveProgress();
                updateProgress();
                updateSidebarHighlight();

                document.getElementById('page-info').textContent = `${pageNum} / ${totalPages}`;
                document.getElementById('prev').disabled = pageNum <= 1;
                document.getElementById('next').disabled = pageNum >= totalPages;

                pageLoading.style.display = 'none';
                pdfWrapper.style.display = 'block';
                document.getElementById('viewerArea').scrollTop = 0;

                requestAnimationFrame(() => renderWatermark());

            } catch (error) {
                console.error("Error rendering page:", error);
                pageLoading.innerHTML = '<span style="color:#ef4444;">Error rendering page. Please try reloading.</span>';
            }
            isLoadingPage = false;
        }


        // ==================== INIT ====================
        async function initViewer() {
            try {
                document.getElementById('page-info').textContent = "Verifying...";

                // 1. Check access & get watermark data
                const accessRes = await fetch(`/api/courses/access/${courseId}`);
                const accessData = await accessRes.json();

                if (!accessData.success) {
                    alert(accessData.message);
                    window.location.href = "/my-courses";
                    return;
                }

                const purchaseDate = accessData.purchaseDate ? new Date(accessData.purchaseDate).toLocaleDateString() : 'N/A';
                watermarkText = `${accessData.userEmail} | Purchased: ${purchaseDate}`;

                // 2. Load the full PDF via the stream endpoint using PDF.js
                document.getElementById('page-info').textContent = "Loading PDF...";

                const loadingTask = pdfjsLib.getDocument({
                    url: `/api/courses/stream/${courseId}`,
                    withCredentials: true
                });
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;

                if (totalPages === 0) {
                    document.getElementById('page-info').textContent = "No pages";
                    pageLoading.innerHTML = '<span style="color:#ef4444;">No pages available yet. Please contact support.</span>';
                    return;
                }

                // 3. Load saved progress
                const resumePage = loadSavedProgress();

                // 4. Build sidebar
                buildPageList();
                updateProgress();

                // 5. Resume from last page or start at 1
                const startPage = (resumePage >= 1 && resumePage <= totalPages) ? resumePage : 1;
                updateSidebarHighlight();
                updateProgress();

                loadPage(startPage);

            } catch (err) {
                console.error("Init error:", err);
                alert("Error verifying access.");
            }
        }

        // ==================== CONTROLS ====================
        document.getElementById('prev').addEventListener('click', () => { if (pageNum > 1) loadPage(pageNum - 1); });
        document.getElementById('next').addEventListener('click', () => { if (pageNum < totalPages) loadPage(pageNum + 1); });

        document.addEventListener('keydown', (e) => {
            if (totalPages === 0) return;
            if (e.key === 'ArrowLeft' && pageNum > 1) loadPage(pageNum - 1);
            if (e.key === 'ArrowRight' && pageNum < totalPages) loadPage(pageNum + 1);
        });

        // ==================== SECURITY (window blur) ====================
        window.addEventListener('blur', () => {
            document.getElementById('viewer-container').classList.add('blurred');
            document.getElementById('security-warning').style.display = 'flex';
            document.title = "⚠️ Security Warning";
        });

        window.addEventListener('focus', () => {
            document.getElementById('viewer-container').classList.remove('blurred');
            document.getElementById('security-warning').style.display = 'none';
            document.title = "Course Reader | Stribble";
        });

        // Re-render watermark on resize
        window.addEventListener('resize', () => {
            if (totalPages > 0) renderWatermark();
        });

        // Start the viewer
        initViewer();

        // Session heartbeat
        setInterval(async () => {
            try {
                const res = await fetch('/api/auth/me');
                if (res.status === 401) location.reload();
            } catch(e) {}
        }, 60000);
    </script>
</body>
</html>
